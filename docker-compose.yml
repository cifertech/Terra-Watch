services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - PORT=8787
      - EONET_BASE_URL=https://eonet.gsfc.nasa.gov/api/v3
      - USGS_EARTHQUAKE_FEED_URL=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson
      - NOAA_STORMS_FEED_URL=https://www.nhc.noaa.gov/CurrentStorms.json
      - AI_CHAT_ENDPOINT=
      - AI_CHAT_API_KEY=
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:8787
    ports:
      - "4173:4173"
    depends_on:
      - api
